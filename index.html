<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Futebol de Botão Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        #tela-login { background: #34495e; padding: 30px; border-radius: 10px; margin-top: 50px; text-align: center; }
        #tela-login input, #tela-login select { margin: 10px; padding: 10px; border-radius: 5px; border: none; width: 220px; }
        #tela-login button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        
        #tela-jogo { display: none; width: 100%; max-width: 1200px; margin-top: 20px; justify-content: space-between; }
        
        #painel-jogo { flex: 2; display: flex; flex-direction: column; align-items: center; }
        #painel-topo { width: 800px; display: flex; justify-content: space-between; align-items: center; background: #34495e; padding: 10px; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; }
        
        .time-box { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
        .cor-box { width: 20px; height: 20px; border-radius: 50%; border: 2px solid white; }
        #placar { font-size: 30px; font-weight: bold; background: #2c3e50; padding: 5px 20px; border-radius: 10px; }
        #status-turno { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #f1c40f; }
        
        canvas { background-color: #2ecc71; border: 5px solid #ecf0f1; border-radius: 10px; cursor: crosshair; }
        
        #chat-container { flex: 1; background: #34495e; margin-left: 20px; border-radius: 10px; display: flex; flex-direction: column; height: 650px; }
        #mensagens { flex: 1; padding: 10px; overflow-y: auto; text-align: left; }
        #input-chat { display: flex; padding: 10px; }
        #input-chat input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        #input-chat button { padding: 10px; background: #3498db; color: white; border: none; border-radius: 5px; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="tela-login">
        <h2>Futebol de Botão</h2>
        <input type="text" id="nome-jogador" placeholder="Seu Nome (Ex: Zico)"><br>
        <input type="text" id="nome-time" placeholder="Nome do Time"><br>
        
        <select id="tipo-jogador">
            <option value="casa">1. Sou o Time da Casa (Cria a sala)</option>
            <option value="visitante">2. Sou o Visitante (Entra na sala)</option>
        </select><br>

        <label>Cor do seu botão:</label><br>
        <input type="color" id="cor-jogador" value="#ff0000"><br>
        <button onclick="entrarNoJogo()">Entrar no Jogo</button>
    </div>

    <div id="tela-jogo">
        <div id="painel-jogo">
            <div id="status-turno">CRIANDO SALA...</div>
            <div id="painel-topo">
                <div class="time-box"><div id="cor-casa" class="cor-box" style="background: red;"></div> <span id="nome-casa">Casa</span></div>
                <div id="placar"><span id="gols-casa">0</span> x <span id="gols-vis">0</span></div>
                <div class="time-box"><span id="nome-vis">Visitante</span> <div id="cor-vis" class="cor-box" style="background: blue;"></div></div>
            </div>
            <canvas id="campo" width="800" height="600"></canvas>
        </div>
        
        <div id="chat-container">
            <div id="mensagens"></div>
            <div id="input-chat">
                <input type="text" id="texto-mensagem" placeholder="Chat..." onkeypress="verificarEnter(event)">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://imdmajqeevevtuulcauu.supabase.co'; 
        const supabaseKey = 'sb_publishable_QS8QvgodsDUey5eRX-YyGA_LWHAfNtc'; 
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        let jogador = { nome: '', time: '', cor: '' };
        let chatChannel;
        
        let souCasa = true;
        let turnoDaCasa = true; 
        let turnoEmAndamento = false; 
        let jogoIniciado = false;
        
        let golsCasa = 0, golsVis = 0;

        let bola = { x: 400, y: 300, raio: 12, vx: 0, vy: 0, cor: '#ffffff' };
        let botaoCasa = { x: 200, y: 300, raio: 25, vx: 0, vy: 0, cor: '#ff0000' };
        let botaoVis = { x: 600, y: 300, raio: 25, vx: 0, vy: 0, cor: '#0000ff' };
        let meuBotao; 

        function entrarNoJogo() {
            jogador.nome = document.getElementById('nome-jogador').value || 'Jogador';
            jogador.time = document.getElementById('nome-time').value || 'Time';
            jogador.cor = document.getElementById('cor-jogador').value;
            
            souCasa = (document.getElementById('tipo-jogador').value === 'casa');
            
            if (souCasa) {
                meuBotao = botaoCasa; botaoCasa.cor = jogador.cor;
                document.getElementById('nome-casa').innerText = jogador.time;
                document.getElementById('cor-casa').style.background = jogador.cor;
                document.getElementById('status-turno').innerText = "AGUARDANDO O VISITANTE ENTRAR...";
            } else {
                meuBotao = botaoVis; botaoVis.cor = jogador.cor;
                document.getElementById('nome-vis').innerText = jogador.time;
                document.getElementById('cor-vis').style.background = jogador.cor;
            }

            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-jogo').style.display = 'flex';

            iniciarConexao();
            iniciarFisicaDoJogo();
        }

        function iniciarConexao() {
            chatChannel = clienteSupabase.channel('sala-global');
            
            // 1. Visitante avisa que entrou
            if (!souCasa) {
                setTimeout(() => {
                    chatChannel.send({ type: 'broadcast', event: 'visitante_entrou', payload: jogador });
                }, 1000);
            }

            // 2. Host recebe o visitante e manda começar
            chatChannel.on('broadcast', { event: 'visitante_entrou' }, (p) => {
                if (souCasa) {
                    let vis = p.payload;
                    botaoVis.cor = vis.cor;
                    document.getElementById('nome-vis').innerText = vis.time;
                    document.getElementById('cor-vis').style.background = vis.cor;
                    
                    chatChannel.send({ type: 'broadcast', event: 'iniciar_partida', payload: jogador });
                    liberarJogo();
                }
            });

            // 3. Visitante recebe autorização do Host
            chatChannel.on('broadcast', { event: 'iniciar_partida' }, (p) => {
                if (!souCasa) {
                    let host = p.payload;
                    botaoCasa.cor = host.cor;
                    document.getElementById('nome-casa').innerText = host.time;
                    document.getElementById('cor-casa').style.background = host.cor;
                    liberarJogo();
                }
            });

            // 4. Receber Chute
            chatChannel.on('broadcast', { event: 'chute' }, (p) => {
                let d = p.payload;
                if (souCasa) { botaoVis.vx = d.vx; botaoVis.vy = d.vy; } 
                else { botaoCasa.vx = d.vx; botaoCasa.vy = d.vy; }
                turnoEmAndamento = true;
            });

            // 5. Receber Sincronização Final do Host
            chatChannel.on('broadcast', { event: 'sincronizar' }, (p) => {
                if (!souCasa) {
                    let d = p.payload;
                    botaoCasa.x = d.bcX; botaoCasa.y = d.bcY;
                    botaoVis.x = d.bvX; botaoVis.y = d.bvY;
                    bola.x = d.blX; bola.y = d.blY;
                    botaoCasa.vx = 0; botaoCasa.vy = 0; botaoVis.vx = 0; botaoVis.vy = 0; bola.vx = 0; bola.vy = 0;
                    
                    turnoDaCasa = d.turnoCasa;
                    turnoEmAndamento = false;
                    atualizarStatusTurno();
                }
            });

            // 6. Receber Gol
            chatChannel.on('broadcast', { event: 'gol' }, (p) => {
                golsCasa = p.payload.gc; golsVis = p.payload.gv;
                document.getElementById('gols-casa').innerText = golsCasa;
                document.getElementById('gols-vis').innerText = golsVis;
                
                turnoDaCasa = p.payload.turnoCasa;
                resetarPosicoes();
            });

            // Chat
            chatChannel.on('broadcast', { event: 'mensagem' }, (p) => {
                mostrarMensagemNaTela(p.payload.nome, p.payload.time, p.payload.cor, p.payload.texto);
            }).subscribe();
        }

        function liberarJogo() {
            jogoIniciado = true;
            atualizarStatusTurno();
        }

        function atualizarStatusTurno() {
            const status = document.getElementById('status-turno');
            if (!jogoIniciado) return;
            
            if (souCasa === turnoDaCasa) {
                status.innerText = "SUA VEZ DE JOGAR!"; status.style.color = "#2ecc71";
            } else {
                status.innerText = "VEZ DO ADVERSÁRIO..."; status.style.color = "#e74c3c";
            }
        }

        function resetarPosicoes() {
            botaoCasa.x = 200; botaoCasa.y = 300; botaoCasa.vx = 0; botaoCasa.vy = 0;
            botaoVis.x = 600; botaoVis.y = 300; botaoVis.vx = 0; botaoVis.vy = 0;
            bola.x = 400; bola.y = 300; bola.vx = 0; bola.vy = 0;
            turnoEmAndamento = false;
            atualizarStatusTurno();
        }

        // CHAT
        function enviarMensagem() {
            const i = document.getElementById('texto-mensagem');
            if (i.value.trim() === '') return;
            chatChannel.send({ type: 'broadcast', event: 'mensagem', payload: { nome: jogador.nome, time: jogador.time, cor: jogador.cor, texto: i.value }});
            mostrarMensagemNaTela(jogador.nome, jogador.time, jogador.cor, i.value);
            i.value = '';
        }
        function verificarEnter(e) { if (e.key === 'Enter') enviarMensagem(); }
        function mostrarMensagemNaTela(n, t, c, txt) {
            const cx = document.getElementById('mensagens');
            cx.innerHTML += `<div style="margin-bottom:5px"><b style="color:${c}">[${t}] ${n}:</b> <span style="color:white">${txt}</span></div>`;
            cx.scrollTop = cx.scrollHeight;
        }

        // FÍSICA
        function calcularColisao(a, b) {
            let dx = b.x - a.x, dy = b.y - a.y;
            let dist = Math.hypot(dx, dy);
            if (dist < a.raio + b.raio) {
                let sobre = (a.raio + b.raio) - dist;
                let nx = dx / dist, ny = dy / dist;
                a.x -= nx * (sobre / 2); a.y -= ny * (sobre / 2);
                b.x += nx * (sobre / 2); b.y += ny * (sobre / 2);

                let p = 2 * (a.vx * nx + a.vy * ny - b.vx * nx - b.vy * ny) / 2;
                a.vx -= p * nx; a.vy -= p * ny; b.vx += p * nx; b.vy += p * ny;
            }
        }

        function moverPeca(p, w, h) {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.95; p.vy *= 0.95; // Mais atrito para parar de vez
            if (Math.abs(p.vx) < 0.1) p.vx = 0;
            if (Math.abs(p.vy) < 0.1) p.vy = 0;

            if (p.x + p.raio > w) { p.x = w - p.raio; p.vx *= -0.8; }
            if (p.x - p.raio < 0) { p.x = p.raio; p.vx *= -0.8; }
            if (p.y + p.raio > h) { p.y = h - p.raio; p.vy *= -0.8; }
            if (p.y - p.raio < 0) { p.y = p.raio; p.vy *= -0.8; }
        }

        function iniciarFisicaDoJogo() {
            const canvas = document.getElementById('campo');
            const ctx = canvas.getContext('2d');
            let arrastando = false, mX = 0, mY = 0;

            canvas.addEventListener('mousedown', (e) => {
                if (!jogoIniciado || souCasa !== turnoDaCasa || turnoEmAndamento) return; 
                const rect = canvas.getBoundingClientRect();
                const dist = Math.hypot((e.clientX - rect.left) - meuBotao.x, (e.clientY - rect.top) - meuBotao.y);
                if (dist < meuBotao.raio) arrastando = true;
            });

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mX = e.clientX - rect.left; mY = e.clientY - rect.top;
            });

            canvas.addEventListener('mouseup', () => {
                if (arrastando) {
                    meuBotao.vx = (meuBotao.x - mX) * 0.15;
                    meuBotao.vy = (meuBotao.y - mY) * 0.15;
                    arrastando = false; turnoEmAndamento = true;

                    chatChannel.send({ type: 'broadcast', event: 'chute', payload: { vx: meuBotao.vx, vy: meuBotao.vy }});
                }
            });

            function loop() {
                // Desenhar Campo
                ctx.fillStyle = '#2ecc71'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Desenhar Traves (Gols)
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fillRect(0, 200, 40, 200); // Gol Esquerda (Casa)
                ctx.fillRect(760, 200, 40, 200); // Gol Direita (Visitante)

                ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(400, 0); ctx.lineTo(400, 600); ctx.stroke();
                ctx.beginPath(); ctx.arc(400, 300, 70, 0, Math.PI * 2); ctx.stroke();

                if (!arrastando && jogoIniciado) {
                    moverPeca(botaoCasa, 800, 600); moverPeca(botaoVis, 800, 600); moverPeca(bola, 800, 600);
                    calcularColisao(botaoCasa, bola); calcularColisao(botaoVis, bola); calcularColisao(botaoCasa, botaoVis);
                }

                // Checagem de Parada e Gol (SOMENTE O HOST FAZ ISSO)
                let velTotal = Math.abs(botaoCasa.vx) + Math.abs(botaoCasa.vy) + Math.abs(botaoVis.vx) + Math.abs(botaoVis.vy) + Math.abs(bola.vx) + Math.abs(bola.vy);
                
                if (turnoEmAndamento && velTotal === 0 && souCasa) {
                    // Checar Gol
                    if (bola.x < 40 && bola.y > 200 && bola.y < 400) {
                        golsVis++; turnoDaCasa = true; // Gol do visitante, bola da casa
                        chatChannel.send({ type: 'broadcast', event: 'gol', payload: { gc: golsCasa, gv: golsVis, turnoCasa: turnoDaCasa }});
                        resetarPosicoes();
                    } else if (bola.x > 760 && bola.y > 200 && bola.y < 400) {
                        golsCasa++; turnoDaCasa = false; // Gol da casa, bola do visitante
                        chatChannel.send({ type: 'broadcast', event: 'gol', payload: { gc: golsCasa, gv: golsVis, turnoCasa: turnoDaCasa }});
                        resetarPosicoes();
                    } else {
                        // Passar a vez normalmente
                        turnoDaCasa = !turnoDaCasa;
                        chatChannel.send({ type: 'broadcast', event: 'sincronizar', payload: { 
                            turnoCasa: turnoDaCasa, bcX: botaoCasa.x, bcY: botaoCasa.y, bvX: botaoVis.x, bvY: botaoVis.y, blX: bola.x, blY: bola.y 
                        }});
                        turnoEmAndamento = false;
                        atualizarStatusTurno();
                    }
                }

                // Desenhar Mira
                if (arrastando) {
                    ctx.beginPath(); ctx.moveTo(meuBotao.x, meuBotao.y); ctx.lineTo(mX, mY);
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)'; ctx.lineWidth = 4; ctx.stroke();
                }

                // Desenhar Peças
                function desenhar(p) {
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
                    ctx.fillStyle = p.cor; ctx.fill();
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
                }
                desenhar(botaoCasa); desenhar(botaoVis); desenhar(bola);

                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
