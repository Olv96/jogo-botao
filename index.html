<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Futebol de Botão Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        #tela-login { background: #34495e; padding: 30px; border-radius: 10px; margin-top: 50px; text-align: center; }
        #tela-login input, #tela-login select { margin: 10px; padding: 10px; border-radius: 5px; border: none; width: 220px; text-transform: uppercase; }
        #tela-login button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 16px; }
        
        #tela-jogo { display: none; width: 100%; max-width: 1600px; margin-top: 20px; justify-content: space-between; gap: 20px; padding: 0 20px; box-sizing: border-box; }
        
        #painel-jogo { flex: 3; display: flex; flex-direction: column; align-items: center; }
        #painel-topo { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; background: #34495e; padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; }
        
        .time-box { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 20px; }
        .cor-box { width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; }
        
        #placar { font-size: 36px; font-weight: bold; background: #1a252f; padding: 10px 30px; border-radius: 10px; display: flex; gap: 15px; align-items: center; border: 2px solid #7f8c8d; }
        .sigla-placar { font-size: 24px; color: #bdc3c7; }
        
        #status-turno { font-size: 22px; font-weight: bold; margin-bottom: 10px; color: #f1c40f; text-transform: uppercase; }
        
        canvas { background-color: #2ecc71; border: 5px solid #ecf0f1; border-radius: 10px; cursor: crosshair; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        #chat-container { flex: 1; min-width: 300px; background: #34495e; border-radius: 10px; display: flex; flex-direction: column; height: 790px; }
        #mensagens { flex: 1; padding: 15px; overflow-y: auto; text-align: left; font-size: 14px; }
        #input-chat { display: flex; padding: 10px; background: #2c3e50; border-radius: 0 0 10px 10px; }
        #input-chat input { flex: 1; padding: 12px; border-radius: 5px; border: none; font-size: 14px; }
        #input-chat button { padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 5px; margin-left: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="tela-login">
        <h2>Futebol de Botão</h2>
        <input type="text" id="nome-jogador" placeholder="Seu Nome"><br>
        <input type="text" id="nome-time" placeholder="Nome do Time"><br>
        <input type="text" id="sigla-time" placeholder="Sigla do Time (Ex: FLA)" maxlength="3"><br>
        
        <select id="tipo-jogador">
            <option value="casa">1. Sou o Time da Casa (Cria a sala)</option>
            <option value="visitante">2. Sou o Visitante (Entra na sala)</option>
        </select><br>

        <label>Cor do seu time:</label><br>
        <input type="color" id="cor-jogador" value="#ff0000" style="height: 40px;"><br>
        <button onclick="entrarNoJogo()">Entrar no Jogo</button>
    </div>

    <div id="tela-jogo">
        <div id="painel-jogo">
            <div id="status-turno">CRIANDO SALA...</div>
            <div id="painel-topo">
                <div class="time-box">
                    <div id="cor-box-casa" class="cor-box" style="background: red;"></div> 
                    <span id="nome-casa">Casa</span>
                </div>
                
                <div id="placar">
                    <span id="sigla-placar-casa" class="sigla-placar">CAS</span>
                    <span id="gols-casa">0</span> x <span id="gols-vis">0</span>
                    <span id="sigla-placar-vis" class="sigla-placar">VIS</span>
                </div>
                
                <div class="time-box">
                    <span id="nome-vis">Visitante</span> 
                    <div id="cor-box-vis" class="cor-box" style="background: blue;"></div>
                </div>
            </div>
            
            <!-- Campo ainda maior (1200x700) -->
            <canvas id="campo" width="1200" height="700"></canvas>
        </div>
        
        <div id="chat-container">
            <div id="mensagens"></div>
            <div id="input-chat">
                <input type="text" id="texto-mensagem" placeholder="Chat..." onkeypress="verificarEnter(event)">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://imdmajqeevevtuulcauu.supabase.co'; 
        const supabaseKey = 'sb_publishable_QS8QvgodsDUey5eRX-YyGA_LWHAfNtc'; 
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        let chatChannel;
        let souCasa = true;
        let turnoDaCasa = true; 
        let turnoEmAndamento = false; 
        let jogoIniciado = false;
        
        let jogador = { nome: '', time: '', sigla: '', cor: '' };
        let corCasa = '#ff0000', corVis = '#0000ff';
        let golsCasa = 0, golsVis = 0;

        // Posições Iniciais dos 5 Botões (Índice 0 = Goleiro, raio 35)
        const inicioCasa = [
            { x: 70, y: 350, r: 35 },  // Goleiro
            { x: 300, y: 200, r: 25 },
            { x: 450, y: 350, r: 25 },
            { x: 300, y: 500, r: 25 },
            { x: 650, y: 350, r: 25 }
        ];
        
        const inicioVis = [
            { x: 1130, y: 350, r: 35 }, // Goleiro
            { x: 900, y: 200, r: 25 },
            { x: 750, y: 350, r: 25 },
            { x: 900, y: 500, r: 25 },
            { x: 550, y: 350, r: 25 }
        ];

        // Montando os times com as posições iniciais
        let timeCasa = inicioCasa.map((p, i) => ({ id: i, x: p.x, y: p.y, raio: p.r, vx: 0, vy: 0 }));
        let timeVis = inicioVis.map((p, i) => ({ id: i, x: p.x, y: p.y, raio: p.r, vx: 0, vy: 0 }));
        
        let bola = { x: 600, y: 350, raio: 12, vx: 0, vy: 0 };
        let pecaArrastada = null; 

        function entrarNoJogo() {
            jogador.nome = document.getElementById('nome-jogador').value || 'Jogador';
            jogador.time = document.getElementById('nome-time').value || 'Time';
            jogador.sigla = (document.getElementById('sigla-time').value || '???').substring(0, 3).toUpperCase();
            jogador.cor = document.getElementById('cor-jogador').value;
            
            souCasa = (document.getElementById('tipo-jogador').value === 'casa');
            
            if (souCasa) {
                corCasa = jogador.cor;
                document.getElementById('nome-casa').innerText = jogador.time;
                document.getElementById('sigla-placar-casa').innerText = jogador.sigla;
                document.getElementById('cor-box-casa').style.background = corCasa;
                document.getElementById('status-turno').innerText = "AGUARDANDO O VISITANTE ENTRAR...";
            } else {
                corVis = jogador.cor;
                document.getElementById('nome-vis').innerText = jogador.time;
                document.getElementById('sigla-placar-vis').innerText = jogador.sigla;
                document.getElementById('cor-box-vis').style.background = corVis;
            }

            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-jogo').style.display = 'flex';

            iniciarConexao();
            iniciarFisicaDoJogo();
        }

        function iniciarConexao() {
            chatChannel = clienteSupabase.channel('sala-global');
            
            if (!souCasa) {
                setTimeout(() => chatChannel.send({ type: 'broadcast', event: 'visitante_entrou', payload: jogador }), 1000);
            }

            chatChannel.on('broadcast', { event: 'visitante_entrou' }, (p) => {
                if (souCasa) {
                    corVis = p.payload.cor;
                    document.getElementById('nome-vis').innerText = p.payload.time;
                    document.getElementById('sigla-placar-vis').innerText = p.payload.sigla;
                    document.getElementById('cor-box-vis').style.background = corVis;
                    
                    chatChannel.send({ type: 'broadcast', event: 'iniciar_partida', payload: { 
                        hostTime: jogador.time, hostSigla: jogador.sigla, hostCor: corCasa, 
                        visCor: corVis 
                    }});
                    liberarJogo();
                }
            });

            chatChannel.on('broadcast', { event: 'iniciar_partida' }, (p) => {
                if (!souCasa) {
                    corCasa = p.payload.hostCor;
                    corVis = p.payload.visCor;
                    document.getElementById('nome-casa').innerText = p.payload.hostTime;
                    document.getElementById('sigla-placar-casa').innerText = p.payload.hostSigla;
                    document.getElementById('cor-box-casa').style.background = corCasa;
                    liberarJogo();
                }
            });

            chatChannel.on('broadcast', { event: 'chute' }, (p) => {
                let d = p.payload;
                if (souCasa) { timeVis[d.id].vx = d.vx; timeVis[d.id].vy = d.vy; } 
                else { timeCasa[d.id].vx = d.vx; timeCasa[d.id].vy = d.vy; }
                turnoEmAndamento = true;
            });

            chatChannel.on('broadcast', { event: 'sincronizar' }, (p) => {
                if (!souCasa) {
                    let d = p.payload;
                    timeCasa.forEach((b, i) => { b.x = d.posCasa[i].x; b.y = d.posCasa[i].y; b.vx = 0; b.vy = 0; });
                    timeVis.forEach((b, i) => { b.x = d.posVis[i].x; b.y = d.posVis[i].y; b.vx = 0; b.vy = 0; });
                    bola.x = d.blX; bola.y = d.blY; bola.vx = 0; bola.vy = 0;
                    
                    turnoDaCasa = d.turnoCasa;
                    turnoEmAndamento = false;
                    atualizarStatusTurno();
                }
            });

            chatChannel.on('broadcast', { event: 'gol' }, (p) => {
                golsCasa = p.payload.gc; golsVis = p.payload.gv;
                document.getElementById('gols-casa').innerText = golsCasa;
                document.getElementById('gols-vis').innerText = golsVis;
                turnoDaCasa = p.payload.turnoCasa;
                resetarPosicoes();
            });

            chatChannel.on('broadcast', { event: 'mensagem' }, (p) => {
                mostrarMensagemNaTela(p.payload.nome, p.payload.sigla, p.payload.cor, p.payload.texto);
            }).subscribe();
        }

        function liberarJogo() {
            jogoIniciado = true;
            atualizarStatusTurno();
        }

        function atualizarStatusTurno() {
            const status = document.getElementById('status-turno');
            if (!jogoIniciado) return;
            if (souCasa === turnoDaCasa) {
                status.innerText = "Sua vez de jogar!"; status.style.color = "#2ecc71";
            } else {
                status.innerText = "Vez do adversário..."; status.style.color = "#e74c3c";
            }
        }

        function resetarPosicoes() {
            timeCasa.forEach((b, i) => { b.x = inicioCasa[i].x; b.y = inicioCasa[i].y; b.vx = 0; b.vy = 0; });
            timeVis.forEach((b, i) => { b.x = inicioVis[i].x; b.y = inicioVis[i].y; b.vx = 0; b.vy = 0; });
            bola.x = 600; bola.y = 350; bola.vx = 0; bola.vy = 0;
            turnoEmAndamento = false;
            atualizarStatusTurno();
        }

        // CHAT
        function enviarMensagem() {
            const i = document.getElementById('texto-mensagem');
            if (i.value.trim() === '') return;
            chatChannel.send({ type: 'broadcast', event: 'mensagem', payload: { nome: jogador.nome, sigla: jogador.sigla, cor: jogador.cor, texto: i.value }});
            mostrarMensagemNaTela(jogador.nome, jogador.sigla, jogador.cor, i.value);
            i.value = '';
        }
        function verificarEnter(e) { if (e.key === 'Enter') enviarMensagem(); }
        function mostrarMensagemNaTela(n, s, c, txt) {
            const cx = document.getElementById('mensagens');
            cx.innerHTML += `<div style="margin-bottom:8px"><b style="color:${c}">[${s}] ${n}:</b> <span style="color:white">${txt}</span></div>`;
            cx.scrollTop = cx.scrollHeight;
        }

        // FÍSICA
        function calcularColisao(a, b) {
            let dx = b.x - a.x, dy = b.y - a.y;
            let dist = Math.hypot(dx, dy);
            if (dist < a.raio + b.raio) {
                let sobre = (a.raio + b.raio) - dist;
                let nx = dx / dist, ny = dy / dist;
                
                // Se a bola entrar num botão sem querer, empurra os dois
                a.x -= nx * (sobre / 2); a.y -= ny * (sobre / 2);
                b.x += nx * (sobre / 2); b.y += ny * (sobre / 2);

                let p = 2 * (a.vx * nx + a.vy * ny - b.vx * nx - b.vy * ny) / 2;
                a.vx -= p * nx; a.vy -= p * ny; 
                b.vx += p * nx; b.vy += p * ny;
            }
        }

        function moverPeca(p, w, h) {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.985; p.vy *= 0.985; 
            if (Math.abs(p.vx) < 0.05) p.vx = 0; 
            if (Math.abs(p.vy) < 0.05) p.vy = 0;

            if (p.x + p.raio > w) { p.x = w - p.raio; p.vx *= -0.7; }
            if (p.x - p.raio < 0) { p.x = p.raio; p.vx *= -0.7; }
            if (p.y + p.raio > h) { p.y = h - p.raio; p.vy *= -0.7; }
            if (p.y - p.raio < 0) { p.y = p.raio; p.vy *= -0.7; }
        }

        function iniciarFisicaDoJogo() {
            const canvas = document.getElementById('campo');
            const ctx = canvas.getContext('2d');
            let arrastando = false, mX = 0, mY = 0;

            // O Clique ainda é no canvas para mirar no botão
            canvas.addEventListener('mousedown', (e) => {
                if (!jogoIniciado || souCasa !== turnoDaCasa || turnoEmAndamento) return; 
                
                const rect = canvas.getBoundingClientRect();
                let clickX = e.clientX - rect.left;
                let clickY = e.clientY - rect.top;
                
                let meuTime = souCasa ? timeCasa : timeVis;
                
                for (let p of meuTime) {
                    if (Math.hypot(clickX - p.x, clickY - p.y) < p.raio) {
                        pecaArrastada = p;
                        arrastando = true;
                        break;
                    }
                }
            });

            // O Movimento do mouse (mirar) agora é lido na JANELA INTEIRA!
            window.addEventListener('mousemove', (e) => {
                if (arrastando) {
                    const rect = canvas.getBoundingClientRect();
                    mX = e.clientX - rect.left; 
                    mY = e.clientY - rect.top;
                }
            });

            // Soltar o mouse agora é lido na JANELA INTEIRA!
            window.addEventListener('mouseup', () => {
                if (arrastando && pecaArrastada) {
                    pecaArrastada.vx = (pecaArrastada.x - mX) * 0.12; 
                    pecaArrastada.vy = (pecaArrastada.y - mY) * 0.12;
                    arrastando = false; 
                    turnoEmAndamento = true;

                    chatChannel.send({ type: 'broadcast', event: 'chute', payload: { 
                        id: pecaArrastada.id, vx: pecaArrastada.vx, vy: pecaArrastada.vy 
                    }});
                    pecaArrastada = null;
                }
            });

            function loop() {
                // Fundo do Campo
                ctx.fillStyle = '#2ecc71'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Desenhar as Redes dos Gols
                ctx.fillStyle = '#bdc3c7';
                ctx.fillRect(0, 250, 60, 200); // Rede Esquerda
                ctx.fillRect(1140, 250, 60, 200); // Rede Direita

                // Padronagem da rede (linhas cruzadas)
                ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 2;
                for(let i = 0; i <= 60; i += 15) {
                    ctx.beginPath(); ctx.moveTo(i, 250); ctx.lineTo(i, 450); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(1140 + i, 250); ctx.lineTo(1140 + i, 450); ctx.stroke();
                }
                for(let i = 250; i <= 450; i += 15) {
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(60, i); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(1140, i); ctx.lineTo(1200, i); ctx.stroke();
                }

                // Linhas do Campo (Meio e Área)
                ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(600, 0); ctx.lineTo(600, 700); ctx.stroke(); // Meio
                ctx.beginPath(); ctx.arc(600, 350, 80, 0, Math.PI * 2); ctx.stroke(); // Circulo Central
                
                ctx.strokeRect(0, 150, 180, 400); // Grande Área Esquerda
                ctx.strokeRect(1020, 150, 180, 400); // Grande Área Direita

                let todasAsPecas = [...timeCasa, ...timeVis, bola];

                if (!arrastando && jogoIniciado) {
                    todasAsPecas.forEach(p => moverPeca(p, canvas.width, canvas.height));
                    
                    for (let i = 0; i < todasAsPecas.length; i++) {
                        for (let j = i + 1; j < todasAsPecas.length; j++) {
                            calcularColisao(todasAsPecas[i], todasAsPecas[j]);
                        }
                    }
                }

                // Lógica de Gols e Turnos (SOMENTE O HOST)
                let velTotal = todasAsPecas.reduce((acc, p) => acc + Math.abs(p.vx) + Math.abs(p.vy), 0);
                
                if (turnoEmAndamento && velTotal < 0.25 && souCasa) {
                    // Bola dentro da rede (Gol Casa ou Visitante)
                    if (bola.x < 60 && bola.y > 250 && bola.y < 450) {
                        golsVis++; turnoDaCasa = true; 
                        chatChannel.send({ type: 'broadcast', event: 'gol', payload: { gc: golsCasa, gv: golsVis, turnoCasa: turnoDaCasa }});
                        resetarPosicoes();
                    } else if (bola.x > 1140 && bola.y > 250 && bola.y < 450) {
                        golsCasa++; turnoDaCasa = false; 
                        chatChannel.send({ type: 'broadcast', event: 'gol', payload: { gc: golsCasa, gv: golsVis, turnoCasa: turnoDaCasa }});
                        resetarPosicoes();
                    } else {
                        turnoDaCasa = !turnoDaCasa;
                        chatChannel.send({ type: 'broadcast', event: 'sincronizar', payload: { 
                            turnoCasa: turnoDaCasa, 
                            posCasa: timeCasa.map(b => ({x: b.x, y: b.y})), 
                            posVis: timeVis.map(b => ({x: b.x, y: b.y})), 
                            blX: bola.x, blY: bola.y 
                        }});
                        turnoEmAndamento = false;
                        atualizarStatusTurno();
                    }
                }

                // Linha de Mira
                if (arrastando && pecaArrastada) {
                    ctx.beginPath(); ctx.moveTo(pecaArrastada.x, pecaArrastada.y); ctx.lineTo(mX, mY);
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)'; ctx.lineWidth = 4; ctx.stroke();
                }

                // Função de Desenho Aprimorada (Goleiros e Linha)
                function desenhar(p, corOFicial, isBola = false) {
                    ctx.beginPath(); 
                    ctx.arc(p.x, p.y, p.raio, 0, Math.PI * 2);
                    ctx.fillStyle = corOFicial; ctx.fill();
                    ctx.strokeStyle = isBola ? '#000' : '#fff'; 
                    ctx.lineWidth = isBola ? 2 : 3; 
                    ctx.stroke();

                    // Se for goleiro (Raio 35), desenha um detalhe extra dentro
                    if (p.raio === 35 && !isBola) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                
                timeCasa.forEach(b => desenhar(b, corCasa));
                timeVis.forEach(b => desenhar(b, corVis));
                desenhar(bola, '#ffffff', true);

                requestAnimationFrame(loop);
            }
            loop();
        }
    </script>
</body>
</html>
