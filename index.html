<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Futebol de Botão Online</title>
    <!-- Importando o Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        #tela-login { background: #34495e; padding: 30px; border-radius: 10px; margin-top: 50px; text-align: center; }
        #tela-login input { margin: 10px; padding: 10px; border-radius: 5px; border: none; width: 200px; }
        #tela-login button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        #tela-jogo { display: none; width: 100%; max-width: 1200px; margin-top: 20px; justify-content: space-between; }
        
        #campo-container { flex: 2; display: flex; justify-content: center; }
        canvas { background-color: #2ecc71; border: 5px solid #ecf0f1; border-radius: 10px; cursor: crosshair; }
        
        #chat-container { flex: 1; background: #34495e; margin-left: 20px; border-radius: 10px; display: flex; flex-direction: column; height: 600px; }
        #mensagens { flex: 1; padding: 10px; overflow-y: auto; text-align: left; }
        #input-chat { display: flex; padding: 10px; }
        #input-chat input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        #input-chat button { padding: 10px; background: #3498db; color: white; border: none; border-radius: 5px; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="tela-login">
        <h2>Futebol de Botão</h2>
        <input type="text" id="nome-jogador" placeholder="Seu Nome (Ex: Zico)"><br>
        <input type="text" id="nome-time" placeholder="Nome do Time"><br>
        <label>Cor do seu time no Chat:</label><br>
        <input type="color" id="cor-jogador" value="#ff0000"><br>
        <button onclick="entrarNoJogo()">Entrar no Jogo</button>
    </div>

    <!-- TELA DO JOGO (CAMPO + CHAT) -->
    <div id="tela-jogo">
        <div id="campo-container">
            <!-- Campo de jogo -->
            <canvas id="campo" width="800" height="600"></canvas>
        </div>
        
        <div id="chat-container">
            <div id="mensagens"></div>
            <div id="input-chat">
                <input type="text" id="texto-mensagem" placeholder="Digite uma mensagem..." onkeypress="verificarEnter(event)">
                <button onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // === CONFIGURAÇÃO SUPABASE ===
        const supabaseUrl = 'https://imdmajqeevevtuulcauu.supabase.co'; 
        const supabaseKey = 'sb_publishable_QS8QvgodsDUey5eRX-YyGA_LWHAfNtc'; 
        
        // Conectando ao banco de dados usando o nome correto para evitar erro
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        // Dados do Jogador
        let jogador = { nome: '', time: '', cor: '' };
        let chatChannel;

        function entrarNoJogo() {
            jogador.nome = document.getElementById('nome-jogador').value || 'Jogador';
            jogador.time = document.getElementById('nome-time').value || 'Time';
            jogador.cor = document.getElementById('cor-jogador').value;

            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-jogo').style.display = 'flex';

            iniciarChat();
            iniciarFisicaDoJogo();
        }

        // === LÓGICA DO CHAT (SUPABASE REALTIME) ===
        function iniciarChat() {
            // Cria um canal de comunicação
            chatChannel = clienteSupabase.channel('sala-global');
            
            chatChannel.on('broadcast', { event: 'mensagem' }, (payload) => {
                mostrarMensagemNaTela(payload.payload.nome, payload.payload.time, payload.payload.cor, payload.payload.texto);
            }).subscribe();
        }

        function enviarMensagem() {
            const input = document.getElementById('texto-mensagem');
            const texto = input.value.trim();
            if (texto === '') return;

            // Envia a mensagem para os outros
            chatChannel.send({
                type: 'broadcast',
                event: 'mensagem',
                payload: { nome: jogador.nome, time: jogador.time, cor: jogador.cor, texto: texto }
            });

            // Mostra a própria mensagem na tela
            mostrarMensagemNaTela(jogador.nome, jogador.time, jogador.cor, texto);
            input.value = '';
        }

        function verificarEnter(event) {
            if (event.key === 'Enter') enviarMensagem();
        }

        function mostrarMensagemNaTela(nome, time, cor, texto) {
            const caixa = document.getElementById('mensagens');
            caixa.innerHTML += `<div style="margin-bottom: 5px;">
                <b style="color: ${cor}">[${time}] ${nome}:</b> <span style="color: white">${texto}</span>
            </div>`;
            caixa.scrollTop = caixa.scrollHeight; // Rola pro final
        }

        // === FÍSICA DO JOGO (ARRASTAR E SOLTAR) ===
        function iniciarFisicaDoJogo() {
            const canvas = document.getElementById('campo');
            const ctx = canvas.getContext('2d');

            // Nosso botão (jogador)
            let botao = { x: 200, y: 300, raio: 25, vx: 0, vy: 0, cor: jogador.cor };
            
            // Variáveis de controle do mouse
            let arrastando = false;
            let mouseX = 0;
            let mouseY = 0;

            // Eventos de Mouse
            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                // Verifica se clicou no botão
                const dist = Math.hypot(clickX - botao.x, clickY - botao.y);
                if (dist < botao.raio) { arrastando = true; }
            });

            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mouseX = e.clientX - rect.left;
                mouseY = e.clientY - rect.top;
            });

            canvas.addEventListener('mouseup', () => {
                if (arrastando) {
                    // Ao soltar, aplica força na direção oposta ao arrasto (como um estilingue)
                    botao.vx = (botao.x - mouseX) * 0.1;
                    botao.vy = (botao.y - mouseY) * 0.1;
                    arrastando = false;
                }
            });

            // Loop principal do jogo (roda 60 vezes por segundo)
            function loop() {
                // Limpa o canvas (desenha a grama)
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Desenha as linhas do campo (básico)
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
                ctx.stroke();

                // Física do Botão
                if (!arrastando) {
                    botao.x += botao.vx;
                    botao.y += botao.vy;
                    // Atrito (para o botão parar de deslizar)
                    botao.vx *= 0.98;
                    botao.vy *= 0.98;

                    // Colisão com as paredes do campo
                    if (botao.x + botao.raio > canvas.width || botao.x - botao.raio < 0) botao.vx *= -1;
                    if (botao.y + botao.raio > canvas.height || botao.y - botao.raio < 0) botao.vy *= -1;
                }

                // Desenha a linha de mira (se estiver arrastando)
                if (arrastando) {
                    ctx.beginPath();
                    ctx.moveTo(botao.x, botao.y);
                    ctx.lineTo(mouseX, mouseY);
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }

                // Desenha o Botão
                ctx.beginPath();
                ctx.arc(botao.x, botao.y, botao.raio, 0, Math.PI * 2);
                ctx.fillStyle = botao.cor;
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                requestAnimationFrame(loop);
            }
            loop(); // Inicia o loop
        }
    </script>
</body>
</html>
